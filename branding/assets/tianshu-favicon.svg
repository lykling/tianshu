<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>天枢 TIANSHU Favicon</title>
  <desc>极简 favicon：北斗七星 + 天枢高亮，16/32/64 自适应。</desc>

  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d878"/>
      <stop offset="100%" stop-color="#8a6f3d"/>
    </linearGradient>
  </defs>

  <!-- 北斗七星连线（粗线，便于小尺寸识别） -->
  <g stroke="url(#favGold)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 斗身（四边形） -->
    <path d="M 14 44 L 14 26 L 30 26 L 30 44 Z"/>
    <!-- 斗柄 -->
    <polyline points="30,35 42,32 50,24 60,16"/>
  </g>

  <!-- 天枢主角节点（高亮双层） -->
  <circle cx="14" cy="44" r="5" fill="url(#favGold)"/>
  <circle cx="14" cy="44" r="2.5" fill="#fff8d8"/>

  <!-- 其他六星节点 -->
  <g fill="url(#favGold)">
    <circle cx="14" cy="26" r="2.5"/>
    <circle cx="30" cy="26" r="2.5"/>
    <circle cx="30" cy="44" r="2.5"/>
    <circle cx="42" cy="32" r="2.5"/>
    <circle cx="50" cy="24" r="2.5"/>
    <circle cx="60" cy="16" r="2.5"/>
  </g>
</svg>

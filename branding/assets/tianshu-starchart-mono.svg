<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>天枢 TIANSHU - 古星图单色版</title>
  <desc>北斗七星古星图单色 Logo：适用于深色背景、印章、烫金、单色印刷。</desc>

  <!-- 透明背景；所有元素使用 currentColor，可在使用处通过 CSS color 改色 -->

  <!-- 外圆环（双层） -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>

  <!-- 二十四节气刻度 -->
  <g stroke="currentColor" stroke-width="0.6" opacity="0.45">
    <line x1="150" y1="14" x2="150" y2="22"/>
    <line x1="218" y1="35" x2="214" y2="42"/>
    <line x1="265" y1="82" x2="258" y2="88"/>
    <line x1="286" y1="150" x2="278" y2="150"/>
    <line x1="265" y1="218" x2="258" y2="212"/>
    <line x1="218" y1="265" x2="214" y2="258"/>
    <line x1="150" y1="286" x2="150" y2="278"/>
    <line x1="82" y1="265" x2="86" y2="258"/>
    <line x1="35" y1="218" x2="42" y2="212"/>
    <line x1="14" y1="150" x2="22" y2="150"/>
    <line x1="35" y1="82" x2="42" y2="88"/>
    <line x1="82" y1="35" x2="86" y2="42"/>
  </g>

  <!-- 北斗七星连线 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="70" y1="200" x2="70" y2="140"/>
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="70" y2="200"/>
    <line x1="130" y1="170" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="220" y2="130"/>
    <line x1="220" y1="130" x2="260" y2="100"/>
  </g>

  <!-- 七星节点（实心） -->
  <!-- 天枢 (α) - 主角，双层环 -->
  <circle cx="70" cy="200" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="70" cy="200" r="7" fill="currentColor"/>

  <!-- 其他六星 -->
  <g fill="currentColor">
    <circle cx="70" cy="140" r="6"/>
    <circle cx="130" cy="140" r="6"/>
    <circle cx="130" cy="200" r="6"/>
    <circle cx="180" cy="160" r="6"/>
    <circle cx="220" cy="130" r="6"/>
    <circle cx="260" cy="100" r="6"/>
  </g>

  <!-- 七星中文标签 -->
  <g font-family="'Songti SC', 'STSong', 'Noto Serif CJK SC', Georgia, serif" fill="currentColor">
    <text x="70" y="227" text-anchor="middle" font-size="15" font-weight="700">天枢</text>
    <text x="50" y="135" text-anchor="end" font-size="10" opacity="0.85">天璇</text>
    <text x="150" y="135" font-size="10" opacity="0.85">天玑</text>
    <text x="150" y="208" font-size="10" opacity="0.85">天权</text>
    <text x="195" y="156" font-size="10" opacity="0.85">玉衡</text>
    <text x="235" y="126" font-size="10" opacity="0.85">开阳</text>
    <text x="275" y="96" font-size="10" opacity="0.85">摇光</text>
  </g>

  <!-- 北极指示虚线 -->
  <line x1="70" y1="200" x2="32" y2="268"
        stroke="currentColor" stroke-width="0.9"
        stroke-dasharray="3 3" opacity="0.7"/>
  <text x="20" y="283" font-family="'Songti SC', serif" font-size="9"
        fill="currentColor" opacity="0.75">北极</text>

  <!-- 底部英文标题 -->
  <text x="150" y="295" text-anchor="middle"
        font-family="Georgia, serif" font-size="9"
        fill="currentColor" letter-spacing="3" opacity="0.7">TIANSHU · α URSAE MAJORIS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>天枢 TIANSHU - 极简几何</title>
  <desc>北斗七星极简几何 Logo：天枢位入口节点，连线即 DAG 边。</desc>

  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d878"/>
      <stop offset="50%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#8a6f3d"/>
    </linearGradient>
    <linearGradient id="goldGNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="50%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#8a6f3d"/>
    </linearGradient>
  </defs>

  <!-- 北斗七星 DAG 连线 -->
  <g stroke="url(#goldG)" stroke-width="2.8" fill="none" stroke-linecap="round">
    <!-- 斗身 -->
    <line x1="70" y1="200" x2="70" y2="140"/>
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="70" y2="200"/>
    <!-- 斗柄 -->
    <line x1="130" y1="170" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="220" y2="130"/>
    <line x1="220" y1="130" x2="260" y2="100"/>
  </g>

  <!-- 北极指示虚线（鎏金虚线） -->
  <line x1="70" y1="200" x2="30" y2="270"
        stroke="url(#goldG)" stroke-width="1.5"
        stroke-dasharray="4 3" opacity="0.7"/>

  <!-- 天枢主角节点（三层） -->
  <circle cx="70" cy="200" r="16" fill="url(#goldGNode)"/>
  <circle cx="70" cy="200" r="10" fill="url(#goldG)"/>
  <circle cx="70" cy="200" r="4" fill="#fff8d8"/>

  <!-- 其他六星节点 -->
  <g>
    <circle cx="70" cy="140" r="9" fill="url(#goldGNode)" opacity="0.9"/>
    <circle cx="130" cy="140" r="9" fill="url(#goldGNode)" opacity="0.9"/>
    <circle cx="130" cy="200" r="9" fill="url(#goldGNode)" opacity="0.9"/>
    <circle cx="180" cy="160" r="9" fill="url(#goldGNode)" opacity="0.9"/>
    <circle cx="220" cy="130" r="9" fill="url(#goldGNode)" opacity="0.9"/>
    <circle cx="260" cy="100" r="9" fill="url(#goldGNode)" opacity="0.9"/>
  </g>

  <!-- 西方星名标签（小，半透明） -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="8" fill="url(#goldG)" opacity="0.65" letter-spacing="1">
    <text x="35" y="138">MERAK</text>
    <text x="140" y="135">PHECDA</text>
    <text x="140" y="218">MEGREZ</text>
    <text x="195" y="156">ALIOTH</text>
    <text x="235" y="124">MIZAR</text>
    <text x="270" y="92">ALKAID</text>
  </g>

  <!-- 天枢主标签 -->
  <text x="70" y="240" text-anchor="middle"
        font-family="Georgia, serif" font-size="13" font-weight="700"
        fill="url(#goldG)" letter-spacing="4">TIANSHU</text>
  <text x="70" y="255" text-anchor="middle"
        font-family="'Songti SC', 'STSong', serif" font-size="11" font-weight="600"
        fill="url(#goldG)">天枢</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>天枢 TIANSHU - 极简几何单色版</title>
  <desc>北斗七星极简几何单色 Logo：适用于文档水印、单色印刷、深色背景。</desc>

  <!-- 所有元素使用 currentColor，可在使用处通过 CSS color 改色 -->

  <!-- 北斗七星 DAG 连线 -->
  <g stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round">
    <line x1="70" y1="200" x2="70" y2="140"/>
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="70" y2="200"/>
    <line x1="130" y1="170" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="220" y2="130"/>
    <line x1="220" y1="130" x2="260" y2="100"/>
  </g>

  <!-- 北极指示虚线 -->
  <line x1="70" y1="200" x2="30" y2="270"
        stroke="currentColor" stroke-width="1.5"
        stroke-dasharray="4 3" opacity="0.7"/>

  <!-- 天枢主角节点（双层环） -->
  <circle cx="70" cy="200" r="16" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="70" cy="200" r="7" fill="currentColor"/>

  <!-- 其他六星节点 -->
  <g fill="currentColor">
    <circle cx="70" cy="140" r="8"/>
    <circle cx="130" cy="140" r="8"/>
    <circle cx="130" cy="200" r="8"/>
    <circle cx="180" cy="160" r="8"/>
    <circle cx="220" cy="130" r="8"/>
    <circle cx="260" cy="100" r="8"/>
  </g>

  <!-- 西方星名标签 -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="8" fill="currentColor" opacity="0.65" letter-spacing="1">
    <text x="35" y="138">MERAK</text>
    <text x="140" y="135">PHECDA</text>
    <text x="140" y="218">MEGREZ</text>
    <text x="195" y="156">ALIOTH</text>
    <text x="235" y="124">MIZAR</text>
    <text x="270" y="92">ALKAID</text>
  </g>

  <!-- 天枢主标签 -->
  <text x="70" y="240" text-anchor="middle"
        font-family="Georgia, serif" font-size="13" font-weight="700"
        fill="currentColor" letter-spacing="4">TIANSHU</text>
  <text x="70" y="255" text-anchor="middle"
        font-family="'Songti SC', 'STSong', serif" font-size="11" font-weight="600"
        fill="currentColor">天枢</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>天枢 TIANSHU - 古星图</title>
  <desc>北斗七星古星图 Logo 彩色版：天枢位斗口主角，与天璇连线指向北极。</desc>

  <defs>
    <radialGradient id="skySC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a2a55"/>
      <stop offset="100%" stop-color="#070b1f"/>
    </radialGradient>
    <radialGradient id="goldSC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="40%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#8a6f3d"/>
    </radialGradient>
    <filter id="glowSC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- 夜空圆盘 -->
  <circle cx="150" cy="150" r="140" fill="url(#skySC)" stroke="#c9a961" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#c9a961" stroke-width="0.4" opacity="0.5"/>

  <!-- 二十四节气刻度（12 主刻度） -->
  <g stroke="#c9a961" stroke-width="0.5" opacity="0.45">
    <line x1="150" y1="14" x2="150" y2="22"/>
    <line x1="218" y1="35" x2="214" y2="42"/>
    <line x1="265" y1="82" x2="258" y2="88"/>
    <line x1="286" y1="150" x2="278" y2="150"/>
    <line x1="265" y1="218" x2="258" y2="212"/>
    <line x1="218" y1="265" x2="214" y2="258"/>
    <line x1="150" y1="286" x2="150" y2="278"/>
    <line x1="82" y1="265" x2="86" y2="258"/>
    <line x1="35" y1="218" x2="42" y2="212"/>
    <line x1="14" y1="150" x2="22" y2="150"/>
    <line x1="35" y1="82" x2="42" y2="88"/>
    <line x1="82" y1="35" x2="86" y2="42"/>
  </g>

  <!-- 背景散星 -->
  <g fill="#c9a961" opacity="0.55">
    <circle cx="40" cy="60" r="1"/>
    <circle cx="80" cy="40" r="0.8"/>
    <circle cx="230" cy="50" r="1.2"/>
    <circle cx="260" cy="180" r="0.8"/>
    <circle cx="240" cy="250" r="1"/>
    <circle cx="100" cy="265" r="0.8"/>
    <circle cx="50" cy="240" r="1"/>
    <circle cx="200" cy="80" r="0.6"/>
    <circle cx="180" cy="240" r="0.7"/>
    <circle cx="35" cy="180" r="0.6"/>
    <circle cx="265" cy="220" r="0.7"/>
  </g>

  <!-- 北斗七星连线 -->
  <g stroke="#c9a961" stroke-width="1.5" opacity="0.85" fill="none" stroke-linecap="round">
    <line x1="70" y1="200" x2="70" y2="140"/>
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="70" y2="200"/>
    <line x1="130" y1="170" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="220" y2="130"/>
    <line x1="220" y1="130" x2="260" y2="100"/>
  </g>

  <!-- 七星节点 -->
  <!-- 天枢 (α) - 主角，三层光晕 -->
  <circle cx="70" cy="200" r="14" fill="url(#goldSC)" filter="url(#glowSC)" opacity="0.7"/>
  <circle cx="70" cy="200" r="9" fill="url(#goldSC)"/>
  <circle cx="70" cy="200" r="4.5" fill="#fff8d8"/>

  <!-- 其他六星 -->
  <g>
    <circle cx="70" cy="140" r="6.5" fill="url(#goldSC)"/>
    <circle cx="130" cy="140" r="6.5" fill="url(#goldSC)"/>
    <circle cx="130" cy="200" r="6.5" fill="url(#goldSC)"/>
    <circle cx="180" cy="160" r="6.5" fill="url(#goldSC)"/>
    <circle cx="220" cy="130" r="6.5" fill="url(#goldSC)"/>
    <circle cx="260" cy="100" r="6.5" fill="url(#goldSC)"/>
  </g>

  <!-- 七星中文标签 -->
  <g font-family="'Songti SC', 'STSong', 'Noto Serif CJK SC', Georgia, serif" fill="#c9a961">
    <text x="70" y="227" text-anchor="middle" font-size="15" font-weight="700">天枢</text>
    <text x="50" y="135" text-anchor="end" font-size="10" opacity="0.85">天璇</text>
    <text x="150" y="135" font-size="10" opacity="0.85">天玑</text>
    <text x="150" y="208" font-size="10" opacity="0.85">天权</text>
    <text x="195" y="156" font-size="10" opacity="0.85">玉衡</text>
    <text x="235" y="126" font-size="10" opacity="0.85">开阳</text>
    <text x="275" y="96" font-size="10" opacity="0.85">摇光</text>
  </g>

  <!-- 北极指示虚线 -->
  <line x1="70" y1="200" x2="32" y2="268"
        stroke="#fff8d8" stroke-width="0.8"
        stroke-dasharray="3 3" opacity="0.6"/>
  <text x="20" y="283" font-family="'Songti SC', serif" font-size="9"
        fill="#fff8d8" opacity="0.75">北极</text>

  <!-- 底部英文标题 -->
  <text x="150" y="295" text-anchor="middle"
        font-family="Georgia, serif" font-size="9"
        fill="#c9a961" letter-spacing="3" opacity="0.7">TIANSHU · α URSAE MAJORIS</text>
</svg>
